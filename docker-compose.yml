services:
  mysql:
    image: mysql:8.4
    container_name: tranding-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: tranding
      MYSQL_USER: tranding
      MYSQL_PASSWORD: tranding
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/01-grant.sql:ro
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tranding-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      # Override .env so the container talks to the mysql service, not localhost.
      DATABASE_URL: "mysql://tranding:tranding@mysql:3306/tranding"
      NODE_ENV: production
      AUTH_TRUST_HOST: "true"
    ports:
      - "3000:3000"

volumes:
  mysql-data:
